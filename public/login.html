<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign In</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
<br>
<br>
    <div class="cont">
        <div class="form sign-in">
            <h2>Welcome</h2>
            <label>
                <span>Email</span>
                <input type="email" id="loginEmail" required />
            </label>
            <label>
                <span>Password</span>
                <input type="password" id="loginPassword" required />
            </label>
            <p class="forgot-pass">Forgot password?</p>
            <button type="button" class="submit" onclick="login()">Sign In</button>
            <div id="loginMessage" class="message"></div>
         
        </div>
        <div class="sub-cont">
            <div class="img">
                <div class="img__text m--up">
                 
                    <h3>Don't have an account? Please Sign up!<h3>
                </div>
                <div class="img__text m--in">
                
                    <h3>If you already has an account, just sign in.<h3>
                </div>
                <div class="img__btn">
                    <span class="m--up">Sign Up</span>
                    <span class="m--in">Sign In</span>
                </div>
            </div>
            <div class="form sign-up">
                <h2>Create your Account</h2>
                <label>
                    <span>Username</span>
                    <input type="text" id="signupUsername" required />
                </label>
                <label>
                    <span>Email</span>
                    <input type="email" id="signupEmail" required />
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" id="signupPassword" required />
                </label>
                <button type="button" class="submit" onclick="signup()">Sign Up</button>
                <div id="signupMessage" class="message"></div>
                
            </div>
        </div>
    </div>

    <div class="sub-const-1">
      <div class="const">
        <!-- Content you want to slide out -->
      </div>
    </div>

  <script>
    document.querySelector('.img__btn').addEventListener('click', function() {
        document.querySelector('.cont').classList.toggle('s--signup');
    });
    document.querySelector('.sub-const-1 .const').classList.add('slide-out');

    // ── POPUP NOTIFICATION ──
    function showPopup(message, type) {
        // Remove existing popup if any
        const existing = document.getElementById('popup-toast');
        if (existing) existing.remove();

        const popup = document.createElement('div');
        popup.id = 'popup-toast';
        popup.innerHTML = `
            <span class="popup-icon">${type === 'success' ? 'Success' : 'Error'}</span>
            <span class="popup-text">${message}</span>
        `;
        popup.style.cssText = `
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: ${type === 'success' ? '#2ecc71' : '#e74c3c'};
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        `;
        document.body.appendChild(popup);

        // Slide down
        setTimeout(() => {
            popup.style.transform = 'translateX(-50%) translateY(0)';
        }, 10);

        // Slide back up and remove
        setTimeout(() => {
            popup.style.transform = 'translateX(-50%) translateY(-80px)';
            setTimeout(() => popup.remove(), 400);
        }, 3000);
    }

    // ── LOGIN ──
    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const messageDiv = document.getElementById('loginMessage');

        if (!email || !password) {
            showPopup('Please fill in all fields', 'error');
            return;
        }

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Store token and user
                localStorage.setItem('token', data.token);
                localStorage.setItem('userId', data.user.id);
                localStorage.setItem('user', JSON.stringify(data.user));

                showPopup('Welcome back! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                showPopup(data.message, 'error');
            }
        } catch (error) {
            showPopup('Network error. Please try again.', 'error');
        }
    }

    // ── SIGNUP ──
    async function signup() {
        const username = document.getElementById('signupUsername').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;

        if (!username || !email || !password) {
            showPopup('Please fill in all fields', 'error');
            return;
        }

        if (password.length < 6) {
            showPopup('Password must be at least 6 characters', 'error');
            return;
        }

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Store token and user
                localStorage.setItem('token', data.token);
                localStorage.setItem('userId', data.user.id);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Clear form
                document.getElementById('signupUsername').value = '';
                document.getElementById('signupEmail').value = '';
                document.getElementById('signupPassword').value = '';

                showPopup('Account created! Please sign in.', 'success');

                setTimeout(() => {
                    document.querySelector('.cont').classList.remove('s--signup');
                }, 1500);
            } else {
                showPopup(data.message, 'error');
            }
        } catch (error) {
            showPopup('Network error. Please try again.', 'error');
        }
    }

    // ── ENTER KEY ──
    document.getElementById('loginPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });

    document.getElementById('signupPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') signup();
    });
</script>
</body>
</html>
